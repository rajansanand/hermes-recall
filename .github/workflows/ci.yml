name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Check out tested Hermes host
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: NousResearch/hermes-agent
          ref: 9085061a8ce1de3cb115534fcfae6b5d01be76fc
          path: .host
          persist-credentials: false
      - name: Build isolated test environment
        working-directory: .host
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-test-home
          HERMES_RUNTIME_DIR: ${{ runner.temp }}/hermes-test-runtime
        run: |
          python -m pm.build_env --source . --export-requirements "$RUNNER_TEMP/host-requirements.txt"
          python -m pm.build_env --out "$GITHUB_WORKSPACE/.test-env" \
            --requirements "$RUNNER_TEMP/host-requirements.txt" \
            --requirement "hermes-recall @ file://$GITHUB_WORKSPACE" \
            --requirement 'pytest>=8,<10' --requirement 'pytest-cov>=6,<8' \
            --requirement 'ruamel.yaml>=0.18.16,<0.20' \
            --requirement 'mcp==2.0.0' \
            --requirement 'ruff==0.15.1' --requirement 'build>=1.2,<2'
      - name: Lint and format
        run: |
          .test-env/bin/ruff check .
          .test-env/bin/ruff format --check .
      - name: Run canonical Hermes test runner
        env:
          HERMES_PYTHON: ${{ github.workspace }}/.test-env/bin/python
        run: .host/scripts/run_tests.sh "$GITHUB_WORKSPACE/tests" -j 2 --file-retries 0 -- --tb=short
      - name: Build distribution
        run: .test-env/bin/python -m build
